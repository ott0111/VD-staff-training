<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Void Mod Training • Assessment</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/training.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="background-glow"></div>

<nav class="navbar nav-compact">

<a class="logo" href="index.html">
<img src="assets/logo.png">
<span>Void Training</span>
</a>

</nav>

<div class="quiz-container">

<div class="quiz-card">

<h1>Practical Assessment</h1>

<p class="quiz-subtitle">
You will answer moderator scenarios based on the training.
Answer carefully — this simulates real tickets.
</p>

<div class="username-box" id="usernameBox">

<label>Discord Username</label>

<input id="usernameInput" placeholder="example#1234">

<button id="startQuizBtn" class="start-btn small">
Start Assessment
</button>

</div>

<div id="quizArea" style="display:none;">

<div class="quiz-progress">
Question <span id="currentQ">1</span> / <span id="totalQ">30</span>
</div>

<h2 id="questionText"></h2>

<div id="answersContainer" class="answers"></div>

</div>

</div>

</div>

<script src="data/questions.js"></script>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
